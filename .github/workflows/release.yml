# Tag vX.Y.Z (or vX.Y.Z-rc.N) → tests → npm (trusted publishing, provenance) + ghcr image
# (amd64 + arm64, provenance + SBOM) → GitHub release with the CHANGELOG section.
# A version with a "-" is a pre-release: npm dist-tag `next`, no `latest` image tag.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in the release path: a cache written by another workflow must not
      # be able to reach what gets published.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          case "$pkg" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - run: npm ci
      - run: npm test
      - run: npm run conformance

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Ensure npm >= 11.5.1
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@11
          fi
          npm --version
      # Publishes with the OIDC identity of this workflow + the `release` environment (configured
      # as the package's trusted publisher on npmjs.com). Fallback without it: add
      # `registry-url: https://registry.npmjs.org` to setup-node and NODE_AUTH_TOKEN from a
      # granular token secret here.
      - name: npm publish
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

  docker:
    needs: verify
    runs-on: ubuntu-latest
    # Same approval gate as npm: without it any v* tag pushed by anyone with write access
    # published ghcr.io/synacl-iot/synacl-gateway:latest unreviewed.
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/synacl-iot/synacl-gateway
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true

  github-release:
    needs: [verify, npm, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "See [CHANGELOG.md](https://github.com/synacl-iot/synacl-gateway/blob/main/CHANGELOG.md)." > notes.md
          fi
          {
            echo
            echo "npm: \`npm i -g synacl-gateway@$VERSION\` · Docker: \`ghcr.io/synacl-iot/synacl-gateway:$VERSION\`"
          } >> notes.md
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md --verify-tag $flags
